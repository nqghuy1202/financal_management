name: fintrack

services:
  postgres:
    image: postgres:17-alpine
    container_name: fintrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fintrack_redis
    restart: unless-stopped
    # appendonly bật AOF để dữ liệu (refresh token đang hiệu lực) không mất
    # khi container restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka chạy ở chế độ KRaft — không cần Zookeeper nữa. Một container
  # vừa làm broker vừa làm controller, đủ cho môi trường phát triển.
  kafka:
    image: apache/kafka:3.9.0
    container_name: fintrack_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Ba listener cho ba nhóm client khác nhau:
      #   INTERNAL  — các container khác trong compose (worker, kafka-ui)
      #   EXTERNAL  — ứng dụng Go chạy trên máy host lúc dev
      #   CONTROLLER— giao tiếp nội bộ của KRaft
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Chỉ có 1 broker nên mọi replication factor phải bằng 1, nếu để mặc
      # định là 3 thì broker sẽ không tạo được internal topic và bị treo.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_NUM_PARTITIONS: 3
      # Tắt tự tạo topic để mọi topic đều phải khai báo tường minh — tránh
      # gõ nhầm tên topic mà vẫn chạy được rồi âm thầm mất message.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: fintrack-local-cluster-01
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Giao diện web để xem topic, message và consumer lag — rất tiện khi
  # debug luồng event, và cũng là thứ để quay video demo.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fintrack_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fintrack-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # SMTP server giả lập: worker gửi email vào đây, xem lại qua web UI mà
  # không cần tài khoản email thật.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: fintrack_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025"   # Web UI

volumes:
  postgres_data:
  redis_data:
  kafka_data:
