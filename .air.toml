root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  bin = ".\\tmp\\api.exe"
  cmd = "go build -o .\\tmp\\api.exe .\\cmd\\api"
  delay = 1000
  exclude_dir = ["assets", "bin", "tmp", "vendor", "testdata", "node_modules", "web", "docs", "migrations"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  include_ext = ["go", "yaml", "yml"]
  kill_delay = "2s"
  log = "build-errors.log"
  # send_interrupt = true để air gửi tín hiệu ngắt thay vì kill thẳng,
  # nhờ vậy graceful shutdown vẫn chạy đúng khi live reload.
  send_interrupt = true
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
