# Nginx reverse proxy CHẠY TRÊN CHÍNH VPS (không phải container) — dùng chung VPS đang chạy
# debt-crusher, thêm subdomain riêng cho app này. Copy file này vào
# /etc/nginx/sites-available/financal, symlink sang sites-enabled, rồi chạy
# `certbot --nginx -d finance.hlcompany.id.vn` (xem DEPLOY.md) — certbot sẽ tự thêm block 443 +
# redirect 80->443 vào đúng file này, không cần sửa tay.
#
# Server Go (cmd/web) phục vụ cả /api/* lẫn SPA build trên CÙNG một cổng, nên chỉ cần 1 location
# duy nhất (khác debt-crusher phải tách 2 location cho backend/frontend riêng).

server {
    listen 80;
    listen [::]:80;
    server_name finance.hlcompany.id.vn;

    # WAF (ModSecurity + OWASP CRS) — chỉ áp dụng cho domain này, không ảnh hưởng
    # debt-crusher chạy trên cùng nginx host. Bỏ comment 2 dòng dưới sau khi đã
    # cài module + CRS theo hướng dẫn (xem phần "Cài ModSecurity" trong DEPLOY.md).
    # Giữ modsecurity.conf ở SecRuleEngine DetectionOnly vài ngày trước khi đổi
    # sang "On" để tránh CRS chặn nhầm traffic thật của app.
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsec/main.conf;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
