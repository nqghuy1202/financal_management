version: "2"

sql:
  - engine: postgresql
    # sqlc đọc migration để biết schema, nên không bao giờ lệch giữa
    # code Go và cấu trúc bảng thật: đổi cột mà quên sửa query thì sinh
    # code sẽ báo lỗi ngay, không đợi tới lúc chạy.
    schema: migrations
    queries: internal/repo/queries

    gen:
      go:
        package: sqlc
        out: internal/repo/sqlc
        sql_package: pgx/v5

        emit_interface: true # sinh sẵn interface Querier để mock trong test
        emit_empty_slices: true # trả về [] thay vì nil cho truy vấn :many
        emit_pointers_for_null_types: true # cột NULL -> *T thay vì pgtype

        # Lưu ý về cú pháp override, sqlc rất dễ gây lỗi ở đây:
        #
        #  - `type` chỉ ghi TÊN KIỂU, `package` ghi tên package. Nếu viết
        #    gộp thành type: "uuid.UUID" kèm import thì sqlc ghép lại
        #    thành uuid.uuid.UUID và code sinh ra không biên dịch được.
        #  - Hai override của cùng một kiểu (bản NOT NULL và bản NULL)
        #    phải khai báo import theo CÙNG một cú pháp. Nếu một bên dùng
        #    dạng rút gọn còn bên kia dùng dạng đầy đủ, sqlc coi là hai
        #    import khác nhau và sinh ra hai dòng import trùng tên.
        #  - sqlc KHÔNG báo lỗi khi db_type viết sai, nó lặng lẽ bỏ qua.
        #    Sau mỗi lần sinh code phải mở models.go kiểm tra lại kiểu.
        overrides:
          # Mặc định sqlc ánh xạ uuid sang pgtype.UUID, khá cồng kềnh.
          # Dùng thẳng google/uuid cho đồng bộ với chỗ sinh UUIDv7.
          - db_type: "uuid"
            go_type: &uuid_type
              import: "github.com/google/uuid"
              package: "uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              <<: *uuid_type
              pointer: true

          # citext hành xử như text, chỉ khác là so sánh không phân biệt
          # hoa thường — phía Go vẫn chỉ là string.
          - db_type: "citext"
            go_type: "string"

          # Với pgx/v5, mặc định sqlc sinh pgtype.Timestamptz cho mọi cột
          # thời gian, kể cả cột NOT NULL. Kiểu đó là struct có cờ Valid
          # nên tầng nghiệp vụ phải kiểm tra .Valid ở khắp nơi dù cột
          # không bao giờ NULL. Ép về time.Time cho cột NOT NULL và
          # *time.Time cho cột cho phép NULL.
          #
          # Chú ý: db_type ở đây là "timestamptz" KHÔNG có tiền tố
          # pg_catalog, trong khi numeric bên dưới thì lại CẦN tiền tố đó.
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # Kiểu timestamp (không có múi giờ) sinh ra từ date_trunc trong
          # các truy vấn báo cáo. Cũng ép về time.Time cho đồng nhất.
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # Tiền tệ: NUMERIC phải ra decimal.Decimal, tuyệt đối không được
          # để rơi về float64.
          - db_type: "pg_catalog.numeric"
            go_type: &decimal_type
              import: "github.com/shopspring/decimal"
              package: "decimal"
              type: "Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              <<: *decimal_type
              pointer: true
