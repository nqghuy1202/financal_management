version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Bắt lỗi thật
    - errcheck # lỗi trả về bị bỏ qua
    - govet
    - staticcheck
    - ineffassign # gán giá trị rồi không dùng
    - bodyclose # response.Body không được đóng
    - rowserrcheck # sql.Rows.Err() không được kiểm tra
    - sqlclosecheck # sql.Rows/Stmt không được đóng
    - nilerr # return nil trong khi err != nil
    - errorlint # so sánh lỗi bằng == thay vì errors.Is
    - contextcheck # context bị truyền sai
    - noctx # gọi HTTP không kèm context

    # Chất lượng code
    - unused
    - revive
    - misspell
    - unconvert # ép kiểu thừa
    - wastedassign
    - prealloc # slice nên cấp phát sẵn dung lượng
    - goconst # chuỗi lặp lại nên đưa thành hằng

    # Bảo mật
    - gosec

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: financal_management
  revive:
    rules:
      - name: exported
        disabled: true # chưa bắt buộc doc comment cho mọi hàm export
  gosec:
    excludes:
      - G404 # math/rand: chỉ dùng cho jitter khi retry, không dùng cho bảo mật

issues:
  exclude-rules:
    # File test được nới lỏng vài luật cho gọn.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - goconst
  max-issues-per-linter: 0
  max-same-issues: 0
