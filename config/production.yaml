server:
  mode: release
  port: 8080
  allowOrigins:
    - https://fintrack.example.com
  shutdownTimeout: 20s
  readTimeout: 10s
  writeTimeout: 30s
  idleTimeout: 60s

logger:
  level: info
  fileName: /var/log/fintrack/app.log
  maxSize: 200
  maxBackups: 10
  maxAge: 30
  compress: true

# Mọi giá trị nhạy cảm bên dưới phải được override bằng biến môi trường
# (xem README, tiền tố FM_). Không bao giờ commit secret thật vào file này.
postgres:
  host: postgres
  port: 5432
  user: fintrack
  password: ""
  dbName: fintrack
  sslMode: require
  maxConns: 50
  minConns: 5
  maxConnLifetime: 1h
  maxConnIdleTime: 30m
  connectTimeout: 5s

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  poolSize: 50

kafka:
  brokers:
    - kafka:9092
  topicPrefix: fin

jwt:
  secret: ""
  issuer: financal_management
  accessTokenTTL: 15m
  refreshTokenTTL: 168h

cookie:
  name: refresh_token
  # Chỉ gửi cookie khi gọi endpoint auth, không đính vào mọi request.
  path: /api/v1/auth
  domain: ""
  secure: true
  sameSite: none

rateLimit:
  ip:
    enabled: true
    capacity: 60
    refillPerSecond: 5
  user:
    enabled: true
    capacity: 200
    refillPerSecond: 20
  login:
    enabled: true
    capacity: 5
    refillPerSecond: 0.05
