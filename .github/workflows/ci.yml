name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Huỷ lần chạy cũ khi có commit mới trên cùng nhánh, tránh tốn runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Kiểm tra định dạng code
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Các file sau chưa được format, chạy 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -race bắt data race, thứ mà test thường không phát hiện được bằng
      # mắt thường — đặc biệt quan trọng khi có worker chạy song song.
      # Chỉ chạy được ở đây vì runner Linux có sẵn gcc; máy dev Windows
      # thường không có nên `make test` ở local bỏ cờ này.
      - name: Chạy test
        run: go test -short -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Kiểm tra go.mod đã tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build toàn bộ binary
        run: go build -v ./...
